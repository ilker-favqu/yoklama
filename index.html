    --warn:#C97A2B;
    --warn-soft:#F6E6D3;
    --danger:#B23A2E;
    --danger-soft:#F5DEDB;
    --ok:#3D7A5C;
    --ok-soft:#DDEDE3;
    --holiday:#8B7FB0;
    --holiday-soft:#EAE6F4;

    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#DEE0D6;
    font-family:'Manrope',system-ui,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,0.18);
  }

  /* ---------- header ---------- */
  header.app-header{
    flex:0 0 auto;
    padding:18px 18px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  .logo{width:40px;height:40px;flex:0 0 auto;}
  .logo-photos{position:relative;width:52px;height:40px;flex:0 0 auto;}
  .logo-photos img{
    position:absolute;top:3px;width:32px;height:32px;border-radius:50%;
    object-fit:cover;border:2.5px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);
  }
  .logo-photos .p-ilker{left:0;z-index:2;box-shadow:0 0 0 1.5px var(--ilker);}
  .logo-photos .p-ceren{left:20px;z-index:1;box-shadow:0 0 0 1.5px var(--ceren);}
  .header-text{flex:1;min-width:0;}
  .header-text h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .header-text p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .header-text p .n1{color:var(--ilker);font-weight:700;}
  .header-text p .n2{color:var(--ceren);font-weight:700;}

  /* ---------- main ---------- */
  main.app-main{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px 28px;
  }

  /* ---------- bottom nav ---------- */
  nav.bottom-nav{
    flex:0 0 auto;
    display:flex;
    border-top:1px solid var(--line);
    background:var(--surface);
  }
  nav.bottom-nav button{
    flex:1;
    border:none;
    background:none;
    padding:10px 0 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--ink-faint);
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
  }
  nav.bottom-nav button svg{width:21px;height:21px;}
  nav.bottom-nav button.active{color:var(--ink);}
  nav.bottom-nav button.active svg{color:var(--ilker);}

  /* ---------- section headings ---------- */
  .section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-title:first-child{margin-top:0;}

  /* ---------- calendar ---------- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:10px 8px;
    margin-bottom:12px;
  }
  .cal-nav button.chev{
    border:none;background:var(--surface-alt);width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
  }
  .cal-nav .cal-month{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;text-align:center;flex:1;
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  }
  .cal-nav .cal-month .today-tag{font-size:10px;font-weight:700;color:var(--ilker);letter-spacing:.03em;}

  .cal-grid{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:10px;
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size:14.28% 100%, 100% 14.28%;
    background-position:10px 10px;
  }
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
  .cal-weekdays div{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-faint);letter-spacing:.03em;}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{
    aspect-ratio:1/1;position:relative;border-radius:9px;border:1px solid transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding-bottom:9px;
    font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);
  }
  .cal-cell.blank{visibility:hidden;cursor:default;}
  .cal-cell.no-class{color:var(--ink-faint);background:var(--surface);font-weight:500;}
  .cal-cell.today{border-color:var(--ilker);color:var(--ilker);}
  .cal-cell.holiday-full{background:var(--holiday-soft);color:var(--holiday);}
  .cal-cell.holiday-half{background:linear-gradient(115deg, var(--holiday-soft) 50%, var(--surface) 50%);}
  .cal-dots{position:absolute;bottom:2px;display:flex;gap:2.5px;}
  .cal-dots .mini-ph{width:13px;height:13px;border-radius:50%;object-fit:cover;}
  .mini-ilker{box-shadow:0 0 0 1.4px var(--ilker);}
  .mini-ceren{box-shadow:0 0 0 1.4px var(--ceren);}

  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .legend img.legend-ph{width:10px;height:10px;border-radius:50%;object-fit:cover;display:inline-block;}

  /* ---------- empty state ---------- */
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--ink-soft);
    background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-m);
  }
  .empty-state p{margin:6px 0 16px;font-size:13.5px;}
  .empty-state .big{font-family:'Fraunces',serif;font-size:17px;color:var(--ink);font-weight:600;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:inherit;font-weight:700;font-size:13.5px;border:none;border-radius:var(--radius-s);
    padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-soft{background:var(--surface-alt);color:var(--ink);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- summary / gauges ---------- */
  .course-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:14px 14px 12px;margin-bottom:12px;
  }
  .course-card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px;}
  .course-card-head h3{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;margin:0;}
  .course-limit-tag{font-size:10.5px;color:var(--ink-faint);font-weight:600;white-space:nowrap;}
  .day-chips{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;}
  .day-chip{
    font-size:9.5px;font-weight:700;color:var(--ink-soft);background:var(--surface-alt);
    padding:2px 6px;border-radius:5px;
  }
  .gauge-row{margin-top:9px;}
  .gauge-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;}
  .gauge-label .name-ilker{color:var(--ilker);}
  .gauge-label .name-ceren{color:var(--ceren);}
  .gauge-label .figures{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);font-size:11.5px;}
  .gauge-track{
    position:relative;height:13px;border-radius:7px;background:var(--surface-alt);overflow:hidden;
  }
  .gauge-fill{height:100%;border-radius:7px;transition:width .25s ease;}
  .status-ok{background:var(--ok);}
  .status-warn{background:var(--warn);}
  .status-danger{background:var(--danger);}
  .status-neutral{background:var(--ink-faint);}
  .gauge-note{font-size:11px;margin-top:4px;color:var(--ink-soft);}
  .gauge-note.status-danger-text{color:var(--danger);font-weight:700;}
  .gauge-note.status-warn-text{color:var(--warn);font-weight:700;}

  /* ---------- settings ---------- */
  .settings-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);
    padding:12px;margin-bottom:10px;
  }
  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 2px;border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-row .info{flex:1;min-width:0;}
  .item-row .info .name{font-weight:700;font-size:13.5px;}
  .item-row .info .meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .icon-btn{border:none;background:none;color:var(--ink-faint);cursor:pointer;padding:8px;flex:0 0 auto;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:hover{color:var(--danger);}

  /* ---------- confirm modal ---------- */
  .modal-backdrop{position:absolute;inset:0;background:rgba(20,22,18,0.5);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .confirm-modal{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:78%;max-width:320px;background:var(--surface);border-radius:16px;
    padding:20px 18px 16px;z-index:11;opacity:0;pointer-events:none;transition:all .18s ease;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
  }
  .confirm-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
  .confirm-modal p{font-size:13.5px;line-height:1.5;margin:0 0 16px;color:var(--ink);}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions .btn{flex:1;}

  .form-block{margin-top:10px;}
  .field-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:10px 0 5px;display:block;}
  input[type=text], input[type=number], input[type=date]{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 11px;
    font-family:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);
  }
  input:focus, .day-toggle:focus, button:focus{outline:2px solid var(--ilker);outline-offset:1px;}
  .day-toggle-row{display:flex;gap:5px;flex-wrap:wrap;}
  .day-toggle{
    border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;width:38px;
    font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .day-toggle.active{background:var(--ilker);border-color:var(--ilker);color:#fff;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:600;}
  .checkbox-row input{width:16px;height:16px;}
  .note{font-size:11.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5;}

  /* ---------- day sheet ---------- */
  .sheet-backdrop{
    position:absolute;inset:0;background:rgba(20,22,18,0.42);
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:5;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;max-height:82%;
    background:var(--surface);border-radius:20px 20px 0 0;
    transform:translateY(100%);transition:transform .25s ease;
    z-index:6;display:flex;flex-direction:column;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:10px auto 4px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 12px;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0;}
  .sheet-head .close-x{border:none;background:var(--surface-alt);width:30px;height:30px;border-radius:50%;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sheet-body{padding:14px 18px 24px;overflow-y:auto;}
  .holiday-banner{
    background:var(--holiday-soft);color:var(--holiday);font-weight:700;font-size:12.5px;
    padding:9px 11px;border-radius:9px;margin-bottom:12px;
  }
  .day-course-block{border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;margin-bottom:10px;}
  .day-course-block h4{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;margin:0 0 10px;}
  .person-att-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .person-att-row:last-child{margin-bottom:0;}
  .person-att-row .p-label{width:44px;flex:0 0 auto;font-size:12px;font-weight:800;}
  .p-label.ilker{color:var(--ilker);}
  .p-label.ceren{color:var(--ceren);}
  .seg-col{flex:1;display:flex;flex-direction:column;gap:3px;}
  .att-default{font-size:10px;color:var(--ink-faint);font-weight:600;text-align:right;padding-right:2px;}
  .seg{display:flex;flex:1;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{
    flex:1;border:none;background:var(--bg);padding:7px 0;font-size:11.5px;font-weight:700;
    color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line);font-family:inherit;
  }
  .seg button:last-child{border-right:none;}
  .seg button.sel-ilker{background:var(--ilker);color:#fff;}
  .seg button.sel-ceren{background:var(--ceren);color:#fff;}
</style>
</head>
<body>
<div class="app" id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#93998F;font-size:13px;">Yükleniyor…</div>
</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4Dmv37GUUBwOiYQjaXZbLc1Gre1L8gf4",
  authDomain: "cirinilker.firebaseapp.com",
  projectId: "cirinilker",
  storageBucket: "cirinilker.firebasestorage.app",
  messagingSenderId: "651886737568",
  appId: "1:651886737568:web:dd0f84ef84193d05f7b1c5"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const stateDocRef = doc(db, "yoklama", "shared-state");

/* ================= DATA ================= */
const TR_DOW = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const TR_MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

const DEFAULT_HOLIDAYS = [
  {id:'h_2026-10-28', date:'2026-10-28', name:'Cumhuriyet Bayramı Arifesi', half:true},
  {id:'h_2026-10-29', date:'2026-10-29', name:'Cumhuriyet Bayramı', half:false},
  {id:'h_2027-01-01', date:'2027-01-01', name:'Yılbaşı', half:false},
  {id:'h_2027-03-08', date:'2027-03-08', name:'Ramazan Bayramı Arifesi', half:true},
  {id:'h_2027-03-09', date:'2027-03-09', name:'Ramazan Bayramı 1. Gün', half:false},
  {id:'h_2027-03-10', date:'2027-03-10', name:'Ramazan Bayramı 2. Gün', half:false},
  {id:'h_2027-03-11', date:'2027-03-11', name:'Ramazan Bayramı 3. Gün', half:false},
  {id:'h_2027-04-23', date:'2027-04-23', name:'23 Nisan Ulusal Egemenlik ve Çocuk Bayramı', half:false},
  {id:'h_2027-05-01', date:'2027-05-01', name:'1 Mayıs Emek ve Dayanışma Günü', half:false},
  {id:'h_2027-05-15', date:'2027-05-15', name:'Kurban Bayramı Arifesi', half:true},
  {id:'h_2027-05-16', date:'2027-05-16', name:'Kurban Bayramı 1. Gün', half:false},
  {id:'h_2027-05-17', date:'2027-05-17', name:'Kurban Bayramı 2. Gün', half:false},
  {id:'h_2027-05-18', date:'2027-05-18', name:'Kurban Bayramı 3. Gün', half:false},
  {id:'h_2027-05-19', date:'2027-05-19', name:'Kurban Bayramı 4. Gün / 19 Mayıs Gençlik ve Spor Bayramı', half:false},
];

let state = { courses: [], holidays: JSON.parse(JSON.stringify(DEFAULT_HOLIDAYS)), attendance: {} };
let ui = {
  tab:'calendar',
  viewYear:2026, viewMonth:8, // Eylül 2026
  selectedDate:null,
  confirmDialog:null,
  courseForm:{name:'', days:[], limit:''},
  holidayForm:{date:'', name:'', half:false},
};

let suppressNextSnapshot = false;
let firstLoadDone = false;

/* ================= STORAGE (Firestore) ================= */
async function loadState(){
  try{
    const snap = await getDoc(stateDocRef);
    if(snap.exists()){
      const data = snap.data();
      if(data && data.json){
        const parsed = JSON.parse(data.json);
        state = Object.assign({courses:[],holidays:DEFAULT_HOLIDAYS,attendance:{}}, parsed);
      }
    }else{
      await setDoc(stateDocRef, { json: JSON.stringify(state) });
    }
  }catch(e){ console.error('Firestore okuma hatası', e); }
  firstLoadDone = true;
  render();

  // Diğer telefondaki değişiklikleri anlık yakala
  onSnapshot(stateDocRef, (snap)=>{
    if(!firstLoadDone) return;
    if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
    if(snap.exists()){
      const data = snap.data();
      if(data && data.json){
        state = Object.assign({courses:[],holidays:DEFAULT_HOLIDAYS,attendance:{}}, JSON.parse(data.json));
        render();
      }
    }
  });
}
async function saveState(){
  try{
    suppressNextSnapshot = true;
    await setDoc(stateDocRef, { json: JSON.stringify(state) });
  }catch(e){ console.error('Kaydetme hatası', e); }
}

/* ================= HELPERS ================= */
function pad2(n){return n<10?'0'+n:''+n;}
function dstr(y,m,d){return y+'-'+pad2(m+1)+'-'+pad2(d);}
function turkishDow(dateObj){return ((dateObj.getDay()+6)%7)+1;} // Pzt=1..Paz=7
function getHoliday(ds){return state.holidays.find(h=>h.date===ds);}
function coursesForWeekday(dow){return state.courses.filter(c=>c.days.includes(dow));}
function getEntry(ds,courseId){
  return (state.attendance[ds] && state.attendance[ds][courseId]) || {ilker:0, ceren:0};
}
function setEntry(ds,courseId,person,value){
  if(!state.attendance[ds]) state.attendance[ds] = {};
  const cur = state.attendance[ds][courseId] || {ilker:0,ceren:0};
  cur[person] = value;
  if(cur.ilker===0 && cur.ceren===0){
    delete state.attendance[ds][courseId];
    if(Object.keys(state.attendance[ds]).length===0) delete state.attendance[ds];
  }else{
    state.attendance[ds][courseId] = cur;
  }
  saveState();
  render();
}
function courseTotals(courseId){
  let ilker=0, ceren=0;
  for(const ds in state.attendance){
    const e = state.attendance[ds][courseId];
    if(e){ ilker += e.ilker||0; ceren += e.ceren||0; }
  }
  return {ilker, ceren};
}
function dayHasEntries(ds){
  const day = state.attendance[ds];
  if(!day) return {ilker:false, ceren:false};
  let ilker=false, ceren=false;
  for(const cid in day){ if(day[cid].ilker>0) ilker=true; if(day[cid].ceren>0) ceren=true; }
  return {ilker, ceren};
}
function fmtNum(n){
  return (Math.round(n*10)/10).toString().replace('.', ',');
}
function fmtDateLong(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const dow = turkishDow(dt);
  const dowNames = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
  return d+' '+TR_MONTHS[m-1]+' '+y+' '+dowNames[dow-1];
}

/* ================= ICONS ================= */
const ICONS = {

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="app-header">
      ${logoSVG()}
      <div class="header-text">
        <h1>Yoklama Defteri</h1>
        <p><span class="n1">İlker</span> &amp; <span class="n2">Ceren</span> · ortak devamsızlık takibi</p>
      </div>
    </header>
    <main class="app-main">
      ${ui.tab==='calendar' ? renderCalendarTab() : ''}
      ${ui.tab==='summary' ? renderSummaryTab() : ''}
      ${ui.tab==='settings' ? renderSettingsTab() : ''}
    </main>
    <nav class="bottom-nav">
      <button data-action="set-tab" data-tab="calendar" class="${ui.tab==='calendar'?'active':''}">${ICONS.calendar}Takvim</button>
      <button data-action="set-tab" data-tab="summary" class="${ui.tab==='summary'?'active':''}">${ICONS.chart}Özet</button>
      <button data-action="set-tab" data-tab="settings" class="${ui.tab==='settings'?'active':''}">${ICONS.gear}Ayarlar</button>
    </nav>
    <div class="sheet-backdrop ${ui.selectedDate?'open':''}" data-action="close-sheet"></div>
    <div class="sheet ${ui.selectedDate?'open':''}">
      <div class="sheet-handle"></div>
      ${ui.selectedDate ? renderDaySheet() : ''}
    </div>
    <div class="modal-backdrop ${ui.confirmDialog?'open':''}" data-action="cancel-confirm"></div>
    <div class="confirm-modal ${ui.confirmDialog?'open':''}">
      ${ui.confirmDialog ? `
        <p>${ui.confirmDialog.message}</p>
        <div class="confirm-actions">
          <button class="btn btn-soft" data-action="cancel-confirm">Vazgeç</button>
          <button class="btn btn-danger" data-action="do-confirm">${ui.confirmDialog.confirmLabel||'Sil'}</button>
        </div>
      ` : ''}
    </div>
  `;
  attachOnce();
}

/* ---- Calendar tab ---- */
function renderCalendarTab(){
  const y = ui.viewYear, m = ui.viewMonth;
  const dim = new Date(y, m+1, 0).getDate();
  const firstDow = turkishDow(new Date(y, m, 1));
  const leading = firstDow - 1;
  const totalCells = Math.ceil((leading + dim) / 7) * 7;

  let cells = '';
  for(let i=0;i<totalCells;i++){
    const dayNum = i - leading + 1;
    if(dayNum < 1 || dayNum > dim){
      cells += `<div class="cal-cell blank"></div>`;
      continue;
    }
    const ds = dstr(y,m,dayNum);
    const dow = turkishDow(new Date(y,m,dayNum));
    const hol = getHoliday(ds);
    const today = new Date();
    const isToday = ds === dstr(today.getFullYear(), today.getMonth(), today.getDate());
    const hasCourses = coursesForWeekday(dow).length > 0;
    const dots = dayHasEntries(ds);

    let cls = 'cal-cell';
    if(isToday) cls += ' today';
    if(hol) cls += hol.half ? ' holiday-half' : ' holiday-full';
    else if(!hasCourses) cls += ' no-class';

    cells += `<button class="${cls}" data-action="open-day" data-date="${ds}" title="${hol?hol.name:''}">
      <span>${dayNum}</span>
      <span class="cal-dots">${dots.ilker?`<img class="mini-ph mini-ilker" src="${ILKER_PHOTO}" alt="">`:''}${dots.ceren?`<img class="mini-ph mini-ceren" src="${CEREN_PHOTO}" alt="">`:''}</span>
    </button>`;
  }

  const weekdayHeader = TR_DOW.map(d=>`<div>${d}</div>`).join('');

  return `
    <div class="cal-nav">
      <button class="chev" data-action="prev-month">${ICONS.chevL}</button>
      <div class="cal-month" data-action="goto-today">
        <span>${TR_MONTHS[m]} ${y}</span>
        <span class="today-tag">BUGÜNE GİT</span>
      </div>
      <button class="chev" data-action="next-month">${ICONS.chevR}</button>
    </div>
    <div class="cal-grid">
      <div class="cal-weekdays">${weekdayHeader}</div>
      <div class="cal-days">${cells}</div>
    </div>
    <div class="legend">
      <span><i style="background:var(--holiday-soft)"></i>Resmi tatil</span>
      <span><img class="legend-ph" src="${ILKER_PHOTO}" style="box-shadow:0 0 0 1px var(--ilker)">İlker devamsız</span>
      <span><img class="legend-ph" src="${CEREN_PHOTO}" style="box-shadow:0 0 0 1px var(--ceren)">Ceren devamsız</span>
    </div>
    ${state.courses.length===0 ? `<div class="empty-state" style="margin-top:14px;">
      <p class="big">Henüz ders eklenmedi</p>
      <p>Bir güne dokunmadan önce Ayarlar'dan derslerini ve haftalık programını tanımlamalısın.</p>
      <button class="btn btn-primary" data-action="set-tab" data-tab="settings">Ayarlar'a git</button>
    </div>` : ''}
  `;
}

/* ---- Day sheet ---- */
function renderDaySheet(){
  const ds = ui.selectedDate;
  const [y,m,d] = ds.split('-').map(Number);
  const dow = turkishDow(new Date(y,m-1,d));
  const hol = getHoliday(ds);
  const courses = coursesForWeekday(dow);

  let body = '';
  if(hol){
    body += `<div class="holiday-banner">${hol.half?'Yarım gün resmi tatil':'Tam gün resmi tatil'}: ${hol.name}</div>`;
  }
  if(hol && !hol.half){
    body += `<p style="font-size:13px;color:var(--ink-soft);">Bugün tam gün resmi tatil olduğu için ders girişi kapalı.</p>`;
  }else if(courses.length===0){
    body += `<p style="font-size:13px;color:var(--ink-soft);">Bu gün için programda ders yok. Ayarlar'dan haftalık ders programını güncelleyebilirsin.</p>`;
  }else{
    for(const c of courses){
      const e = getEntry(ds, c.id);
      body += `
        <div class="day-course-block">
          <h4>${c.name}</h4>
          <div class="person-att-row">
            <span class="p-label ilker">İLKER</span>
            ${segControl(ds, c.id, 'ilker', e.ilker)}
          </div>
          <div class="person-att-row">
            <span class="p-label ceren">CEREN</span>
            ${segControl(ds, c.id, 'ceren', e.ceren)}
          </div>
        </div>`;
    }
  }

  return `
    <div class="sheet-head">
      <h2>${fmtDateLong(ds)}</h2>
      <button class="close-x" data-action="close-sheet">${ICONS.x}</button>
    </div>
    <div class="sheet-body">${body}</div>
  `;
}
function segControl(ds, courseId, person, value){
  const selClass = 'sel-'+person;
  function btn(val,label){
    const active = value===val;
    return `<button class="${active?selClass:''}" data-action="set-att" data-date="${ds}" data-course="${courseId}" data-person="${person}" data-value="${val}">${label}</button>`;
  }
  const seg = `<div class="seg">${btn(0.5,'Yarım Gün')}${btn(1,'Tam Gün')}</div>`;
  return value===0 ? `<div class="seg-col">${seg}<span class="att-default">Varsayılan: geldi</span></div>` : seg;
}

/* ---- Summary tab ---- */
function renderSummaryTab(){
  if(state.courses.length===0){
    return `<div class="empty-state">
      <p class="big">Özet için ders gerekiyor</p>
      <p>Dersleri eklediğinde, her ders için İlker ve Ceren'in devamsızlık hakkı burada canlı olarak görünecek.</p>
      <button class="btn btn-primary" data-action="set-tab" data-tab="settings">Ders ekle</button>
    </div>`;
  }
  let html = '';
  for(const c of state.courses){
    const totals = courseTotals(c.id);
    html += `
      <div class="course-card">
        <div class="course-card-head">
          <h3>${c.name}</h3>
          ${c.limit>0 ? `<span class="course-limit-tag">Limit: ${fmtNum(c.limit)}</span>` : `<span class="course-limit-tag">Limit yok</span>`}
        </div>
        <div class="day-chips">${c.days.map(dw=>`<span class="day-chip">${TR_DOW[dw-1]}</span>`).join('')}</div>
        ${gaugeRow('İlker','name-ilker','status-','ilker',totals.ilker,c.limit)}
        ${gaugeRow('Ceren','name-ceren','status-','ceren',totals.ceren,c.limit)}
      </div>`;
  }
  return html;
}
function gaugeRow(label, labelClass, statusPrefix, person, total, limit){
  let status = 'neutral', pct = 0, noteText = '';
  if(limit>0){
    pct = Math.min(100, (total/limit)*100);
    if(total >= limit) status = 'danger';
    else if(total >= limit*0.75) status = 'warn';
    else status = 'ok';
    const remaining = limit - total;
    if(remaining < 0){
      noteText = `<span class="gauge-note status-danger-text">Limit ${fmtNum(Math.abs(remaining))} aşıldı</span>`;
    }else{
      noteText = `<span class="gauge-note ${status==='warn'?'status-warn-text':''}">Kalan hak: ${fmtNum(remaining)}</span>`;
    }
  }else{
    pct = total>0 ? 15 : 0;
    noteText = `<span class="gauge-note">Limit belirlenmedi</span>`;
  }
  return `
    <div class="gauge-row">
      <div class="gauge-label">
        <span class="${labelClass}">${label}</span>
        <span class="figures">${fmtNum(total)}${limit>0?' / '+fmtNum(limit):''}</span>
      </div>
      <div class="gauge-track"><div class="gauge-fill status-${status}" style="width:${pct}%"></div></div>
      ${noteText}
    </div>`;
}

          <input type="checkbox" id="hol-half" data-field="hol-half" ${ui.holidayForm.half?'checked':''}>
          <label for="hol-half">Yarım gün</label>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:12px;" data-action="add-holiday" ${(!ui.holidayForm.date||!ui.holidayForm.name.trim())?'disabled':''}>${ICONS.plus} Tatil ekle</button>
      </div>
      <p class="note">29 Ekim ve dini bayramlar gibi resmi tatiller 2026–2027 dönemi için önceden eklendi. Okulunun ara tatil / final tarihlerini de buraya kendin ekleyebilirsin.</p>
    </div>

    <div class="section-title">Veri</div>
    <div class="settings-card">
      <button class="btn btn-danger btn-block" data-action="reset-attendance">${ICONS.trash} Devamsızlık kayıtlarını sıfırla</button>
    </div>
  `;
}
function escAttr(s){ return (s||'').toString().replace(/"/g,'&quot;'); }
function shortDate(ds){
  const [y,m,d] = ds.split('-').map(Number);
  return d+' '+TR_MONTHS[m-1].slice(0,3);
}

/* ================= EVENTS ================= */
let listenersBound = false;
function attachOnce(){
  const app = document.getElementById('app');
  if(listenersBound) return;
  listenersBound = true;

  app.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;

    if(action==='set-tab'){ ui.tab = t.dataset.tab; render(); }
    else if(action==='prev-month'){ shiftMonth(-1); }
    else if(action==='next-month'){ shiftMonth(1); }
    else if(action==='goto-today'){
      const now = new Date();
      ui.viewYear = now.getFullYear(); ui.viewMonth = now.getMonth(); render();
    }
    else if(action==='open-day'){ ui.selectedDate = t.dataset.date; render(); }
    else if(action==='close-sheet'){ ui.selectedDate = null; render(); }
    else if(action==='set-att'){
      const ds = t.dataset.date, cid = t.dataset.course, person = t.dataset.person;
      const val = parseFloat(t.dataset.value);
      const cur = getEntry(ds, cid)[person];
      if(cur === val){
        ui.confirmDialog = {
          message:'Bu devamsızlık kaydını kaldırmak istediğine emin misin?',
          confirmLabel:'Kaldır',
          action:'clear-att', payload:{ds,cid,person}
        };
        render();
      }else{
        setEntry(ds, cid, person, val);
      }
    }
    else if(action==='toggle-course-day'){
      const day = parseInt(t.dataset.day,10);
      const idx = ui.courseForm.days.indexOf(day);
      if(idx>-1) ui.courseForm.days.splice(idx,1); else ui.courseForm.days.push(day);
      render();
    }
    else if(action==='add-course'){
      if(!ui.courseForm.name.trim() || ui.courseForm.days.length===0) return;
      state.courses.push({
        id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        name:ui.courseForm.name.trim(),
        days:ui.courseForm.days.slice().sort(),
        limit: ui.courseForm.limit ? parseFloat(ui.courseForm.limit) : 0
      });
      ui.courseForm = {name:'', days:[], limit:''};
      saveState(); render();
    }
    else if(action==='delete-course'){
      const course = state.courses.find(c=>c.id===t.dataset.id);
      ui.confirmDialog = {
        message:`"${course?course.name:'Bu ders'}" dersini silmek istiyor musun? Bu derse ait tüm devamsızlık kayıtları da silinecek.`,
        confirmLabel:'Dersi sil',
        action:'delete-course', payload:{id:t.dataset.id}
      };
      render();
    }
    else if(action==='add-holiday'){
      if(!ui.holidayForm.date || !ui.holidayForm.name.trim()) return;
      state.holidays.push({
        id:'h_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
        date:ui.holidayForm.date, name:ui.holidayForm.name.trim(), half:ui.holidayForm.half
      });
      ui.holidayForm = {date:'', name:'', half:false};
      saveState(); render();
    }
    else if(action==='delete-holiday'){
      state.holidays = state.holidays.filter(h=>h.id!==t.dataset.id);
      saveState(); render();
    }
    else if(action==='reset-attendance'){
      ui.confirmDialog = {
        message:'Tüm devamsızlık kayıtları silinecek. Bu işlem geri alınamaz. Emin misin?',
        confirmLabel:'Hepsini sil',
        action:'reset-attendance', payload:{}
      };
      render();
    }
    else if(action==='cancel-confirm'){ ui.confirmDialog = null; render(); }
    else if(action==='do-confirm'){
      const cd = ui.confirmDialog;
      if(cd){
        if(cd.action==='clear-att'){
          const {ds,cid,person} = cd.payload;
          if(state.attendance[ds] && state.attendance[ds][cid]){
            state.attendance[ds][cid][person] = 0;
            const e = state.attendance[ds][cid];
            if(e.ilker===0 && e.ceren===0){
              delete state.attendance[ds][cid];
              if(Object.keys(state.attendance[ds]).length===0) delete state.attendance[ds];
            }
          }
          saveState();
        }else if(cd.action==='delete-course'){
          state.courses = state.courses.filter(c=>c.id!==cd.payload.id);
          for(const ds in state.attendance){
            if(state.attendance[ds][cd.payload.id]) delete state.attendance[ds][cd.payload.id];
            if(Object.keys(state.attendance[ds]).length===0) delete state.attendance[ds];
          }
          saveState();
        }else if(cd.action==='reset-attendance'){
          state.attendance = {};
          saveState();
        }
      }
      ui.confirmDialog = null;
      render();
    }
  });

  app.addEventListener('input', (e)=>{
    const f = e.target.dataset.field;
    if(!f) return;
    if(f==='course-name'){ ui.courseForm.name = e.target.value; }
    else if(f==='course-limit'){ ui.courseForm.limit = e.target.value; renderSoft(); return; }
    else if(f==='hol-date'){ ui.holidayForm.date = e.target.value; }
    else if(f==='hol-name'){ ui.holidayForm.name = e.target.value; }
    else if(f==='hol-half'){ ui.holidayForm.half = e.target.checked; }
    // re-render only to update disabled-state of add buttons, without losing focus for text fields we do a light touch
    updateAddButtonsState();
  });
}
function updateAddButtonsState(){
  const addCourseBtn = document.querySelector('[data-action="add-course"]');
  if(addCourseBtn) addCourseBtn.disabled = !ui.courseForm.name.trim() || ui.courseForm.days.length===0;
  const addHolBtn = document.querySelector('[data-action="add-holiday"]');
  if(addHolBtn) addHolBtn.disabled = !ui.holidayForm.date || !ui.holidayForm.name.trim();
}
function renderSoft(){ /* placeholder for potential partial updates */ }
function shiftMonth(delta){
  let m = ui.viewMonth + delta, y = ui.viewYear;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  ui.viewMonth = m; ui.viewYear = y; render();
}

/* ================= INIT ================= */
loadState();
</script>
</body>
</html>
